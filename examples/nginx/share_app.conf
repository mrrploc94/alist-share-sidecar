location /share-app/ {
    alias /var/www/alist-share/;
    index index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}

location /s/ {
    rewrite ^/s/([A-Za-z0-9_-]+)$ /share-app/download.php?id=$1 last;
}
